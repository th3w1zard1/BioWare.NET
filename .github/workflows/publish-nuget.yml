name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 2.0.0 or 2.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Unable to resolve package version." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore BioWare.NET.sln

      - name: Build
        run: dotnet build src/BioWare/BioWare.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test net9.0
        run: dotnet test tests/BioWare.Tests/BioWare.Tests.csproj -c Release -f net9.0 --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/BioWare/BioWare.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages

      - name: Validate NuGet credentials
        shell: bash
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "The NUGET_API_KEY GitHub Actions secret is not configured." >&2
            echo "Add the secret, then re-run this workflow with workflow_dispatch or push a new version tag." >&2
            exit 1
          fi

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload published artifacts
        uses: actions/upload-artifact@v7
        with:
          name: published-packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error
